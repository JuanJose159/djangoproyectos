{% extends 'layouts/base.html' %}

{% block title %}Nuevo Proyecto{% endblock %}

{% block content %}
    <!-- Encabezado de la vista -->
    <div class="border-b border-slate-200/60 pb-5 mb-6">
        <h1 class="text-2xl font-bold text-slate-800">Nuevo Proyecto</h1>
        <p class="text-sm text-slate-500 mt-1">Diligencia la información para dar de alta un nuevo proyecto.</p>
    </div>

    <!-- Formulario estilizado -->
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- Campo: Nombre -->
        <div class="space-y-1">
            <label for="nombre" class="block text-sm font-semibold text-slate-700">
                Nombre del Proyecto
            </label>
            <input 
                type="text" 
                name="nombre" 
                id="nombre" 
                placeholder="Ej. Rediseño Web Corporativo"
                required
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition shadow-sm">
        </div>

        <!-- Campo: Descripción -->
        <div class="space-y-1">
            <label for="descripcion" class="block text-sm font-semibold text-slate-700">
                Descripción
            </label>
            <textarea 
                name="descripcion" 
                id="descripcion" 
                rows="4" 
                placeholder="Escribe un breve resumen de los objetivos del proyecto..."
                required
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition shadow-sm resize-y"></textarea>
        </div>

        <!-- Campo: Duración -->
        <div class="space-y-1">
            <label for="duracion" class="block text-sm font-semibold text-slate-700">
                Duración (Días)
            </label>
            <input 
                type="number" 
                name="duracion" 
                id="duracion" 
                placeholder="30"
                required 
                step="1" 
                min="1"
                class="w-full sm:w-1/2 px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition shadow-sm">
        </div>

        <!-- Campo: Imagen del proyecto -->
        <div class="space-y-1">
            <label for="imagen" class="block text-sm font-semibold text-slate-700">
                Imagen del proyecto
            </label>
            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-200 border-dashed rounded-xl bg-white/50 hover:bg-white/80 transition cursor-pointer relative">
                <div class="space-y-1 text-center">
                    <svg class="mx-auto h-12 w-12 text-indigo-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <div class="flex text-sm text-slate-600 justify-center">
                        <label for="imagen" class="relative cursor-pointer font-semibold text-indigo-600 hover:text-indigo-500 focus-within:outline-none">
                            <span>Sube un archivo</span>
                            <input id="imagen" name="imagen" type="file" accept="image/*" class="sr-only">
                        </label>
                        <p class="pl-1">o arrastra y suelta</p>
                    </div>
                    <p class="text-xs text-slate-500">PNG, JPG, GIF hasta 10MB</p>
                </div>
            </div>
        </div>

        <!-- Acciones del Formulario -->
        <div class="pt-4 flex justify-end gap-3">
            <a href="{% url 'proyectos' %}" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-sm font-medium transition">
                Cancelar
            </a>
            <button 
                type="submit" 
                class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/35 active:scale-[0.98] transition duration-200">
                Guardar Proyecto
            </button>
        </div>
    </form>
{% endblock %}
