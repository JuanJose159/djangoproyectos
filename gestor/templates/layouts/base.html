{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen p-4 md:p-6 text-slate-800">

  <!-- Navbar -->
  <nav class="w-full max-w-4xl mx-auto mb-6 bg-white/80 backdrop-blur-lg rounded-2xl shadow-md border border-white px-4 md:px-6 py-3 flex items-center justify-between">
    
    <!-- Logo & Marca -->
    <a href="{% url 'home' %}" class="flex items-center gap-3 font-bold text-slate-800 hover:text-indigo-600 transition group">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 text-white text-sm shadow-md shadow-indigo-500/20 group-hover:scale-105 transition duration-200">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-5 h-5 object-contain">
        </span>
        <span class="hidden sm:inline text-lg tracking-tight">Gestor</span>
    </a>

    <!-- Enlaces y Acción -->
    <div class="flex items-center gap-2 sm:gap-4">
        <a href="{% url 'home' %}"
            class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 rounded-xl transition">
            Inicio
        </a>
        <a href="{% url 'proyectos' %}"
            class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/80 rounded-xl transition">
            Proyectos
        </a>

        <!-- Botón Logout estilizado -->
        <form action="{% url 'logout' %}" method="post" class="inline">
            {% csrf_token %}
            <button 
                type="submit" 
                class="px-3.5 py-2 text-sm font-medium text-rose-600 hover:bg-rose-50 rounded-xl transition border border-rose-100/50">
                Salir
            </button>
        </form>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="w-full max-w-4xl mx-auto bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl border border-white p-6 md:p-8">
    {% block content %}
    {% endblock %}
  </main>

</body>
</html>
