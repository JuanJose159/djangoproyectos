{% extends 'layouts/base.html' %}
{% block title %}Proyectos{% endblock %}
{% block content %}
    <H1>Crear tarea a: {{ proyecto.nombre}}</H1>
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="titulo">Título</label>
            <input type="text" name="titulo" id="titulo" required>
        </div>
        <div>
            <label for="titulo">Descripcion</label>
            <textarea name="descripcion" id="descripcion"></textarea>
        </div>
        <div>
            <label for="prioridad">Prioridad</label>
            <select name="prioridad" id="prioridad">
                {% for valor, etiqueta in prioridad_choices %}
                <option value="{{ valor }}" {% if valor == 'MEDIA' %} selected {% endif %}>{{etiqueta}}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="estado">Estado</label>
            <select name="estado" id="estado">
                {% for valor, etiqueta in estado_choices %}
                <option value="{{ valor }}" {% if valor == 'PENDIENTE' %} selected {% endif %}>{{etiqueta}}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit"> Guardar</button>
    </form>
    
{% endblock %}
