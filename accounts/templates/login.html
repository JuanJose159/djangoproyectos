{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4 md:p-6">

    <main class="w-full max-w-md bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl border border-white p-6 md:p-8">
        
        <!-- Header del Formulario -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 text-white shadow-lg shadow-indigo-500/30 mb-3">
                <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-7 h-7 object-contain">
            </div>
            <h1 class="text-2xl font-bold text-slate-800">¡Bienvenido de nuevo!</h1>
            <p class="text-sm text-slate-500 mt-1">Ingresa tus credenciales para acceder</p>
        </div>

        <!-- Formulario -->
        <form action="{% url 'login' %}" method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">
                    Nombre de usuario
                </label>
                <input 
                    type="text" 
                    name="username" 
                    id="username"
                    placeholder="Tu nombre de usuario"
                    required
                    autofocus
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition shadow-sm">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">
                    Contraseña
                </label>
                <input 
                    type="password"
                    name="password"
                    id="password"
                    placeholder="••••••••"
                    required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition shadow-sm">
            </div>

            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/35 active:scale-[0.98] transition duration-200">
                Iniciar Sesión
            </button>
        </form>

    </main>

</body>
</html>
